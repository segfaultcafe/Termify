name: Bug report
description: Report a reproducible problem in Termify
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include access tokens, copyrighted
        audio, private playlist data, or personal database files.

  - type: input
    id: version
    attributes:
      label: Termify version
      description: Run `termify --version` and paste the complete output.
      placeholder: termify 0.8.1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and terminal environment
      description: >-
        Include OS/version, architecture, terminal, dimensions, and audio stack.
      placeholder: macOS 15 arm64, Terminal.app, 120x35, Core Audio
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that triggers the bug.
      placeholder: |
        1. Start Termify
        2. Run ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized terminal output when useful.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mention whether a fresh cache or configuration changes the result.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and personal data from this report.
          required: true
