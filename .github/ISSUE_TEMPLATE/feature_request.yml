name: Feature request
description: Propose a focused improvement to Termify
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should Termify address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user experience rather than only implementation details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs did you consider?

  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options:
        - Playback
        - Queue
        - Search and downloads
        - History, cache, or playlists
        - Terminal interface
        - Packaging and distribution
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and the roadmap for this request.
          required: true
        - label: This request fits Termify's Linux terminal-player scope.
          required: true
