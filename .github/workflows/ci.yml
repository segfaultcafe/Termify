name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whitespace and shell syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

  build:
    name: Build and test (${{ matrix.toolchain.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            cmake \
            g++ \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            ninja-build \
            pkg-config

      - name: Configure
        env:
          CC: ${{ matrix.toolchain.cc }}
          CXX: ${{ matrix.toolchain.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS=-Werror \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run unit tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --output-junit test-results.xml

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-${{ matrix.toolchain.name }}
          path: build/test-results.xml
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            g++ \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            ninja-build \
            pkg-config

      - name: Configure AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-sanitized --parallel 2

      - name: Run unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build-sanitized \
            --output-on-failure \
            --output-junit sanitizer-results.xml

      - name: Upload sanitizer results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-sanitizers
          path: build-sanitized/sanitizer-results.xml
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package smoke test
    needs: [hygiene, build, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            curl \
            g++ \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            make \
            pkg-config

      - name: Build release package
        run: make package

      - name: Verify archive and staged executables
        run: |
          version="$(sed -n 's/^project(termify VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          package="termify-v${version}-linux-$(uname -m)"
          (cd dist && sha256sum -c "${package}.tar.gz.sha256")
          test "$(dist/${package}/termify --version)" = "termify ${version}"
          test -n "$(dist/${package}/yt-dlp --version)"
