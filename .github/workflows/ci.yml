name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whitespace and shell syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n
          bash -n tests/ReleaseAutomationTests.sh
          tests/ReleaseAutomationTests.sh

  build:
    name: Build and test (${{ matrix.toolchain.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            cmake \
            g++ \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            ninja-build \
            pkg-config

      - name: Configure
        env:
          CC: ${{ matrix.toolchain.cc }}
          CXX: ${{ matrix.toolchain.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS=-Werror \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run unit tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --output-junit test-results.xml

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-${{ matrix.toolchain.name }}
          path: build/test-results.xml
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            g++ \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            ninja-build \
            pkg-config

      - name: Configure AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-sanitized --parallel 2

      - name: Run unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build-sanitized \
            --output-on-failure \
            --output-junit sanitizer-results.xml

      - name: Upload sanitizer results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-sanitizers
          path: build-sanitized/sanitizer-results.xml
          if-no-files-found: error
          retention-days: 14

  linux-containers:
    name: Integration (${{ matrix.distribution }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distribution: [arch, debian, ubuntu]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, test, and launch in container
        run: |
          docker build \
            --file "docker/ci/${{ matrix.distribution }}.Dockerfile" \
            --tag "termify-ci:${{ matrix.distribution }}" \
            .

  macos:
    name: Integration (macOS ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Install build dependencies
        run: brew install cmake ffmpeg ninja pkg-config sqlite

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS=-Werror \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run unit and startup integration tests
        timeout-minutes: 5
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --output-junit "test-results-${{ matrix.architecture }}.xml"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-macos-${{ matrix.architecture }}
          path: build/test-results-${{ matrix.architecture }}.xml
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package smoke test (${{ matrix.platform }} ${{ matrix.architecture }})
    needs: [hygiene, build, sanitizers, linux-containers, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x86_64
            runner: ubuntu-24.04
          - platform: linux
            architecture: arm64
            native_architecture: aarch64
            runner: ubuntu-24.04-arm
          - platform: macos
            architecture: x86_64
            runner: macos-15-intel
          - platform: macos
            architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native architecture
        run: >-
          test "$(uname -m)" =
          "${{ matrix.native_architecture || matrix.architecture }}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            curl \
            g++ \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            make \
            pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ffmpeg ninja pkg-config sqlite

      - name: Build release package
        run: make package

      - name: Verify archive, installer, and staged executables
        run: >-
          scripts/verify-release-package.sh
          "${{ matrix.platform }}"
          "${{ matrix.architecture }}"

      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termify-package-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  appimage:
    name: AppImage smoke test (linux ${{ matrix.architecture }})
    needs: [hygiene, build, sanitizers, linux-containers, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12-slim
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install AppImage build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            ca-certificates \
            cmake \
            curl \
            file \
            g++ \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            make \
            ninja-build \
            pkg-config \
            squashfs-tools

      - name: Build self-contained AppImage
        run: make appimage

      - name: Verify checksum, dependency bundle, and startup
        run: scripts/verify-appimage.sh "${{ matrix.architecture }}"

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termify-appimage-linux-${{ matrix.architecture }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  appimage-portability:
    name: AppImage portability (clean ubuntu 24.04 ${{ matrix.architecture }})
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Debian-built AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termify-appimage-linux-${{ matrix.architecture }}
          path: dist

      - name: Prove the AppImage starts without host packages or FUSE
        run: |
          chmod 0755 dist/*.AppImage
          scripts/verify-appimage.sh "${{ matrix.architecture }}"

  deb:
    name: Debian package (${{ matrix.distribution }} ${{ matrix.architecture }})
    needs: [hygiene, build, sanitizers, linux-containers, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: debian12
            architecture: amd64
            runner: ubuntu-24.04
            image: debian:12-slim
          - distribution: debian12
            architecture: arm64
            runner: ubuntu-24.04-arm
            image: debian:12-slim
          - distribution: ubuntu24.04
            architecture: amd64
            runner: ubuntu-24.04
            image: ubuntu:24.04
          - distribution: ubuntu24.04
            architecture: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install package build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            ca-certificates \
            cmake \
            curl \
            dpkg-dev \
            g++ \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            make \
            pkg-config

      - name: Build and verify native Debian package
        run: |
          make deb
          scripts/verify-deb.sh \
            "${{ matrix.distribution }}" \
            "${{ matrix.architecture }}"

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termify-deb-${{ matrix.distribution }}-${{ matrix.architecture }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 14

  deb-install:
    name: Debian package install (${{ matrix.distribution }} ${{ matrix.architecture }})
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: debian12
            architecture: amd64
            runner: ubuntu-24.04
            image: debian:12-slim
          - distribution: debian12
            architecture: arm64
            runner: ubuntu-24.04-arm
            image: debian:12-slim
          - distribution: ubuntu24.04
            architecture: amd64
            runner: ubuntu-24.04
            image: ubuntu:24.04
          - distribution: ubuntu24.04
            architecture: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - name: Check out package verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Debian package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termify-deb-${{ matrix.distribution }}-${{ matrix.architecture }}
          path: dist

      - name: Prove clean install, startup, update guard, and removal
        run: scripts/verify-deb-install.sh dist/*.deb

  package-gate:
    name: Package smoke test
    needs: [package, appimage-portability, deb-install]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm every release package passed
        run: true
