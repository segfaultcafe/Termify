name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the release branch
        run: >-
          git fetch --no-tags origin
          +refs/heads/master:refs/remotes/origin/master

      - name: Validate tag, version, commit, and branch
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          scripts/validate-release-tag.sh
          "$RELEASE_TAG"
          "$EVENT_SHA"
          refs/remotes/origin/master

  package-linux:
    name: Package (linux x86_64)
    needs: validate
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native architecture
        run: test "$(uname -m)" = x86_64

      - name: Install Arch Linux build dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            alsa-lib \
            base-devel \
            cmake \
            curl \
            ffmpeg \
            pkgconf \
            sqlite

      - name: Build and test release package
        run: make package

      - name: Verify archive, installer, and bundled executables
        run: scripts/verify-release-package.sh linux x86_64

      - name: Attest package and checksum
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termify-release-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: Package (macos ${{ matrix.architecture }})
    needs: validate
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Install build dependencies
        run: brew install cmake ffmpeg ninja pkg-config sqlite

      - name: Build and test release package
        run: make package

      - name: Verify archive, installer, and bundled executables
        run: >-
          scripts/verify-release-package.sh
          macos
          "${{ matrix.architecture }}"

      - name: Attest package and checksum
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termify-release-macos-${{ matrix.architecture }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  package-appimage:
    name: Package (AppImage linux x86_64)
    needs: validate
    runs-on: ubuntu-24.04
    container: debian:12-slim
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install AppImage build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            ca-certificates \
            cmake \
            curl \
            file \
            g++ \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            make \
            ninja-build \
            pkg-config \
            squashfs-tools

      - name: Build and test self-contained AppImage
        run: make appimage

      - name: Verify checksum, dependency bundle, and startup
        run: scripts/verify-appimage.sh x86_64

      - name: Attest AppImage and checksum
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.AppImage.sha256

      - name: Upload verified AppImage assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termify-release-appimage-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  verify-appimage-portability:
    name: Verify AppImage (clean ubuntu 24.04)
    needs: package-appimage
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Debian-built AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termify-release-appimage-linux-x86_64
          path: dist

      - name: Prove the release AppImage starts without host packages or FUSE
        run: |
          chmod 0755 dist/*.AppImage
          scripts/verify-appimage.sh x86_64

  publish:
    name: Publish GitHub release
    needs: [validate, package-linux, package-macos, verify-appimage-portability]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: termify-release-*
          path: release-assets
          merge-multiple: true

      - name: Reject missing, extra, or duplicate release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          platforms=(linux-x86_64 macos-x86_64 macos-arm64)
          artifacts=()
          for platform in "${platforms[@]}"; do
            artifacts+=("termify-v${version}-${platform}.tar.gz")
          done
          artifacts+=("termify-v${version}-linux-x86_64.AppImage")
          for artifact in "${artifacts[@]}"; do
            test -f "release-assets/$artifact"
            test -f "release-assets/$artifact.sha256"
          done
          expected=$((${#artifacts[@]} * 2))
          actual="$(find release-assets -maxdepth 1 -type f | wc -l)"
          test "$actual" -eq "$expected"

      - name: Verify collected checksums
        run: |
          source scripts/yt-dlp.sh
          for checksum in release-assets/*.sha256; do
            read -r digest filename extra <"$checksum"
            test -z "${extra:-}"
            test "$filename" = "$(basename "${checksum%.sha256}")"
            termify_verify_sha256 "$digest" "release-assets/$filename"
          done
          LC_ALL=C sort -k2 release-assets/*.sha256 \
            >release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json id >/dev/null 2>&1; then
            echo "A GitHub release already exists for $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Attest aggregate checksum manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Create verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$(cat <<'EOF'
          Release packages were built and tested automatically from this tag.
          Every artifact and checksum has keyless GitHub/Sigstore provenance;
          see `docs/RELEASE.md` for checksum and attestation verification.

          macOS packages are not yet code-signed or notarized.
          EOF
          )"
          gh release create "$RELEASE_TAG" release-assets/* \
            --draft \
            --fail-on-no-commits \
            --generate-notes \
            --notes "$notes" \
            --title "Termify $RELEASE_TAG" \
            --verify-tag

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
